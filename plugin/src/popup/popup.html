<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>InkRead 墨读</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">读</span>
      <div class="brand-t">
        <b>InkRead 墨读</b>
        <span>视频 / 文章生词量 · 三套评级</span>
      </div>
    </div>
    <div class="top-ops">
      <button class="icon-btn" id="btnOptions" title="设置">⚙</button>
    </div>
  </header>

  <div class="link" id="linkBar">
    <span class="dot"></span>
    <span class="link-t" id="linkText">正在检测墨读词库…</span>
    <button class="link-btn" id="btnSync">同步</button>
  </div>

  <main id="main">
    <div class="skel">
      <div class="skel-ring"></div>
      <div class="skel-lines"><i></i><i></i><i></i></div>
    </div>
  </main>

  <footer class="foot">
    <span id="footNote">—</span>
    <span class="sp"></span>
    <button class="btn" id="btnReader" hidden>阅读模式</button>
    <button class="btn" id="btnPanel">页面面板</button>
    <button class="btn primary" id="btnReload">重新分析</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
